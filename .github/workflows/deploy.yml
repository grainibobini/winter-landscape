name: Deploy Winter Landscape to GitHub Pages

on:
  push:
    branches: [ master ]   # или main, если у вас ветка main
  # Разрешить запуск вручную из интерфейса Actions
  workflow_dispatch:

# Даём разрешение на деплой (для pages)
permissions:
  contents: read
  pages: write
  id-token: write
  # для линтера нужны checks (если хотите)
  checks: read
  statuses: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Линтер (проверка качества кода)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Super-Linter
        uses: super-linter/super-linter@v6
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true
          # Не проверяем Markdown (опционально)
          VALIDATE_MARKDOWN: false
          # Отключаем проверку имен файлов (необязательно)
          VALIDATE_NATURAL_LANGUAGE: false

  # Деплой на GitHub Pages
  deploy:
    runs-on: ubuntu-latest
    needs: lint   # деплоим только если линтер успешен
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # весь корень проекта (index.html, style.css, script.js)
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
